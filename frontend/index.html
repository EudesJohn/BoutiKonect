<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Force cache clear and Service Worker update
      const APP_VERSION = '1.2.0'; // Change this string to force a cache clear on next deploy
      if (localStorage.getItem('bk_app_version') !== APP_VERSION) {
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function(registrations) {
            for(let registration of registrations) {
              registration.unregister();
            }
          });
        }
        if ('caches' in window) {
          caches.keys().then((names) => {
            names.forEach(name => {
              // We delete all caches except those that might be strictly required, but usually deleting all is fine for PWA updates
              caches.delete(name);
            });
          });
        }
        localStorage.setItem('bk_app_version', APP_VERSION);
        // Force reload from server, not from cache
        window.location.reload(true);
      }
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="BoutiKonect.bj - Ventes et Services au Bénin. Achetez et vendez facilement." />
    <meta name="theme-color" content="#FF6A00" />
    <link rel="apple-touch-icon" href="/apple-icon-180.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="BoutiKonect" />
    
    <link rel="apple-touch-startup-image" href="/apple-splash-2048-2732.jpg" media="(device-width: 1024px) and (device-height: 1366px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/apple-splash-1668-2388.jpg" media="(device-width: 834px) and (device-height: 1194px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/apple-splash-1170-2532.jpg" media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/apple-splash-1284-2778.jpg" media="(device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/apple-splash-1125-2436.jpg" media="(device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    
    <script src="https://cdn.fedapay.com/checkout.js?v=1.1.7" defer></script>
    
    <title>BoutiKonect.bj - Marketplace Benin</title>
  </head>
  <body>
    <!-- Splash Screen / Loader -->
    <div id="app-loader" style="
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #0d1b2a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 99999;
      transition: opacity 0.5s ease-out;
    ">
      <img src="/logo.jpg" alt="Logo" style="width: 140px; height: 140px; object-fit: contain; margin-bottom: 20px; border-radius: 16px; box-shadow: 0 4px 20px rgba(255,106,0,0.2);">
      <div style="width: 40px; height: 40px; border: 3px solid rgba(255,255,255,0.1); border-top: 3px solid #FF6A00; border-radius: 50%; animation: spin 1s linear infinite;"></div>
      <p style="margin-top: 15px; color: #CBD5E1; font-family: sans-serif; font-size: 14px; letter-spacing: 0.5px;">Initialisation de votre Marketplace...</p>
      <div id="loader-status" style="margin-top: 10px; color: #FF6A00; font-family: monospace; font-size: 12px; opacity: 0.8;"></div>
      <a id="skip-loader" href="javascript:hideAppLoader()" style="margin-top: 20px; color: #64748B; font-size: 12px; text-decoration: underline; display: none;">Accéder quand même</a>
    </div>

    <style>
      @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
      @keyframes pulse { 0% { transform: scale(1); opacity: 0.8; } 50% { transform: scale(1.05); opacity: 1; } 100% { transform: scale(1); opacity: 0.8; } }
    </style>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Fonction pour masquer le loader
      window.hideAppLoader = () => {
        const loader = document.getElementById('app-loader');
        if (loader) {
          loader.style.opacity = '0';
          setTimeout(() => loader.remove(), 500);
        }
      };

      // Fonction pour mettre à jour le statut du loader
      window.setLoaderStatus = (status) => {
        const statusEl = document.getElementById('loader-status');
        if (statusEl) statusEl.innerText = status;
        
        // Afficher le bouton passer après 5 secondes
        setTimeout(() => {
          const skipBtn = document.getElementById('skip-loader');
          if (skipBtn) skipBtn.style.display = 'block';
        }, 5000);
      };
    </script>
  </body>
</html>
